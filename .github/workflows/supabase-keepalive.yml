name: Supabase keep-alive

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday 06:00 UTC — well within the 7-day pause window
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/family_config?select=id&limit=1" \
            -o /dev/null
